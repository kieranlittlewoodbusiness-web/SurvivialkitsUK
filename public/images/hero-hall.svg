  <rect x="200" y="458" width="40" height="120" fill="#4a3c31"/>
  <rect x="740" y="458" width="40" height="120" fill="#4a3c31"/>
  <ellipse cx="320" cy="448" rx="34" ry="14" fill="#1c2429"/>
  <rect x="300" y="390" width="28" height="60" rx="6" fill="#c9d2d8"/>
  <rect x="306" y="370" width="16" height="24" rx="3" fill="#0f5c4c"/>
  <circle cx="314" cy="378" r="4" fill="#f4f7f8" opacity="0.9"/>
