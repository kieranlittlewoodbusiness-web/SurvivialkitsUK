<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hall table at dusk with torch, paper contacts and power bank</title>
  <desc id="desc">Original illustration for The Household Brief: a UK hallway table beside a rain-streaked door glass at dusk.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d8190"/>
      <stop offset="55%" stop-color="#8fa0ab"/>
      <stop offset="100%" stop-color="#b7c3cb"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a454c"/>
      <stop offset="100%" stop-color="#2a3237"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9c4a4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d9c4a4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="540" width="1600" height="360" fill="url(#floor)"/>
  <rect x="980" y="80" width="420" height="520" fill="#4d5d68" opacity="0.85"/>
  <rect x="1000" y="110" width="380" height="460" fill="#9eb0bc"/>
